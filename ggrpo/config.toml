# All ggrpo settings. Paths are relative to this directory, where every command runs.
# Override any key from the command line: --section.key value (e.g. --generate.mode sample).

[data]
mbpp = "data/mbpp_armv8_O2.parquet"                      # python -m ggrpo.build (VM)
humaneval = "data/raw/gg-bench-armv8-O2.parquet"         # HF ahmedheakl/gg-bench-armv8-O2 @ 32a82dd9 (x86, arm, file)
humaneval_tests = "data/raw/asmbench_source.parquet"     # HF ahmedheakl/asmbench_source @ 89bca970 (file, code, test)
beam8_cap16k = "data/raw/humaneval_beam8_cap16k.jsonl"   # ponyo, beam 8, 16000-token cap (raw completions)
# train_ids = "data/train_ids.txt"    # vetted subset (whitespace-separated task ids); unset = all valid MBPP-C
train = "data/train.jsonl"            # also named in grpo.yaml (TRL owns that file)
dev = "data/dev.jsonl"                # checkpoint selection and tuning; HumanEval-C and BringUp stay held out
sft = "data/sft_train.jsonl"          # train as prompt/completion pairs for the SFT baseline (sft.yaml)
sft_exclude = ["mbpp/38"]            # 18,297 tokens with the chat template, over sft.yaml max_length (GG's 16k
                                     # training context): dropped from SFT rather than truncated (Enzo, Oct 23)
dev_fraction = 0.1                    # of distinct MBPP-C x86 programs, so identical prompts stay on one side
split_seed = 0
# MBPP-C twins of HumanEval problems (results/data-survey/decontam.json): dropped after the split, so the other tasks
# keep run 1's train/dev sides (Enzo, Nov 6)
exclude = ["mbpp/1", "mbpp/31", "mbpp/32", "mbpp/67", "mbpp/98", "mbpp/499", "mbpp/556", "mbpp/604", "mbpp/686",
           "mbpp/754", "mbpp/812", "mbpp/872", "mbpp/957"]
eval = "data/eval.jsonl"

[prompt]   # eval/eval_huamaneval.py, verbatim
template = "Convert the following x86 assembly code to ARM assembly:\n```x86asm\n{}\n```"
# Rust regex (polars), group 1 == raw.split("```armasm\n")[-1].split("```")[0]; checked by tests/test_extract.py
extract = '(?s)(?:.*```armasm\n)?(.*?)(?:```|$)'
# GG's answer format, for SFT labels. GG's training code is unreleased; the released model answers exactly this way
# (157/164 base beam-8 HumanEval outputs), and inference.py extracts the code from it
answer = "```armasm\n{}\n```"

[server]
host = "0.0.0.0"
port = 8765
workers = 8
url = "http://127.0.0.1:8765/score"   # as seen from totoro, through the SSH tunnel
timeout = 1200                        # s per scoring request; worst case is 128 completions / 8 workers x (30 + 10) s = 640 s
outage_seconds = 43200                # training waits this long for an unreachable server, logging each retry, then stops
min_free_gb = 5                       # below this the server answers 503: a full disk would turn every verdict into an error
tasks = ["data/train.jsonl", "data/dev.jsonl", "data/eval.jsonl",   # every file must exist: the server scores these
         "data/codenet/train.jsonl", "data/codenet/val.jsonl", "data/codenet/test.jsonl"]

[harness]
cc = ["clang", "-arch", "arm64", "-w"]
asm = ["clang", "-arch", "arm64", "-c", "-x", "assembler"]
ldflags = ["-lm"]
sandbox = "sandbox.sb"
cache = ".cache/drivers"
build_timeout = 30
run_timeout = 10
cpu_seconds = 5
max_file_bytes = 16777216
stderr_tail = 600

[build]   # python -m ggrpo.build, in the VM: MBPP-C -> x86/arm with GG's compile commands (train/compile_*_clang.py)
source = "data/raw/decompile_eval_mbpp.parquet"   # HF LLM4Binary/decompile-eval @ b9271fae, mbpp, language c, opt O0
x86 = ["clang", "-S", "-target", "x86_64-apple-darwin"]
arm = ["clang", "-arch", "arm64", "-S"]
opt = "-O2"
workers = 8
out = "data/mbpp_armv8_O2.parquet"

[codeforces]   # Codeforces eval set (Enzo, Nov 22): evaluation only; tests never trained on, rewarded or redistributed
# python -m ggrpo.codeforces (Mac, --extra data): problems with complete official tests x accepted GNU C solutions
problems = { repo = "open-r1/codeforces", revision = "fbe3f6e903ee854eec2e69e9d96d0306cde59baf", files = "data/*.parquet" }
submissions = { repo = "open-r1/codeforces-submissions", revision = "07e7bf31f284b0e90e02dfc7ab675d5821e1c068", files = "data/*.parquet" }
languages = ["GNU C", "GNU C11"]
solutions = 10                        # Enzo, Nov 22: built per problem, in pick order; the reference and the agreement voters
seed = "codeforces-2026-11-22"        # salt of the pick order and the split: never change it once the test split is used
split = { val = 0.5, test = 0.5 }     # Enzo, Nov 22: 50/50 by problem group (never trained on, so no train share)
max_cpu = 1.0                         # Enzo, Nov 22: reference's slowest test, 5x under harness.cpu_seconds
dissent = 0.2                         # Enzo, Nov 22: multi-answer when >= 2 and >= 20% of the finishing solutions disagree
out = "data/contest/codeforces.parquet"
built = "data/contest/codeforces_built"           # python -m ggrpo.codeforces_build (VM), in parts
chunk = 50
candidates = "data/contest/codeforces_candidates.jsonl"   # written by the build; ggrpo.decontam's items
decontam = "data/contest/codeforces_decontam.parquet"     # ggrpo.decontam --decontam.out for the candidates
decontam_items = "data/contest/codeforces_decontam_items.parquet"   # and its --decontam.items
workers = 6
# python -m ggrpo.codeforces_tasks (Mac, --extra data, after the build and the decontamination run)
tasks = { val = "data/codeforces/val.jsonl", test = "data/codeforces/test.jsonl" }
eval = "data/contest/codeforces_eval.parquet"
drops = "data/contest/codeforces_drops.parquet"

[aoj]   # python -m ggrpo.aoj (Mac): CodeNet's accepted C for Aizu problems x AOJ's official tests (developers.u-aizu.ac.jp)
problems = "https://onlinejudge.u-aizu.ac.jp/api/problems"
testcases = "https://judgedat.u-aizu.ac.jp/testcases"
codenet = { repo = "iNeil77/CodeNet", revision = "1e28cfa9f8eb2df763ad2514af11afd6e92dd07a", files = "C/*.parquet" }
metadata = { repo = "Elfsong/codenet_metadata", revision = "b0e26431ba12f23ce6a4e4baf50980407cedcf54", files = "data/*.parquet" }
language = "C"          # CodeNet original_language of Aizu C submissions
delay = 1.0
only = ["data/codenet/val.jsonl", "data/codenet/test.jsonl"]   # full judge tests for the eval splits (Enzo, Nov 10)
cache = "data/contest/aoj_cache"
out = "data/contest/aoj_eval.parquet"

[codenet]   # python -m ggrpo.codenet (Mac, --extra data): CodeNet's accepted C x the sample cases in its statements
submissions = { repo = "iNeil77/CodeNet", revision = "1e28cfa9f8eb2df763ad2514af11afd6e92dd07a", files = "C/*.parquet" }
metadata = { repo = "Elfsong/codenet_metadata", revision = "b0e26431ba12f23ce6a4e4baf50980407cedcf54", files = "data/*.parquet" }
aoj_language = "C"         # CodeNet original_language of Aizu C submissions; AtCoder's are "C (GCC ...)"
min_outputs = 2            # an RL problem needs this many distinct sample outputs, so a constant program cannot pass
split = { train = 0.6, val = 0.2, test = 0.2 }   # Enzo, Nov 7: "we need 20/20", by problem
seed = "codenet-2026-11-07"   # salt of the split ranking: never change it once the test split has been used
problems = "data/codenet/problems.parquet"
solutions = "data/codenet/solutions.parquet"
built = "data/codenet/built"   # python -m ggrpo.codenet_build (VM): x86, arm and reference verdicts, in parts
chunk = 5000                   # solutions per part
# python -m ggrpo.codenet_tasks (after the build): RL task files, and tasks per problem in each (plan 06 D-2: k = 10)
tasks = { train = "data/codenet/train.jsonl", val = "data/codenet/val.jsonl", test = "data/codenet/test.jsonl" }
cap = { train = 10, val = 1, test = 1 }

[decontam]   # python -m ggrpo.decontam (Mac, --extra data, after the build, ggrpo.anghabench and the canaries)
n = 13                       # canonical tokens per n-gram (the data survey's 13-gram)
min_instructions = 30        # asm rule: shorter eval functions are not checked (the data survey's x86 rule)
min_rare = 20                # asm rule: nor are eval functions with fewer rare n-grams than this (all boilerplate)
min_exact = 5                # exact rule: every item function at least this long must be token-exact in the document
min_rare_c = 10              # c rule: items with fewer rare C n-grams are not checked
max_df = 0.001               # an n-gram in more than this share of the pooled samples is boilerplate
df_sample = 100000           # training documents sampled per source to measure that share
report = 0.2                 # scores from here are written (for the paper's sweep)
drop_asm = 0.5               # asm rule: leave out documents from this score
drop_c = 0.33                # c rule: leave out documents from this score (the survey's manually reviewed line)
evals = ["data/dev.jsonl", "data/eval.jsonl", "data/codenet/val.jsonl", "data/codenet/test.jsonl"]
c_items = []                 # task files that carry their C (Codeforces: [codeforces] candidates, with their own --decontam.out)
bringup = { repo = "ahmedheakl/gg-bench-bringup-O2", revision = "ae6623a3f86a0d33e20d83f84f4989ea9ce61410", files = "data/*.parquet" }
bringup_c = "../eval/bringup-bench"
gg = { repo = "ahmedheakl/gg-armv8-O2-instruct", revision = "5c98f387f25cb4e0bec390e8f1c080e4a02414de", files = "data/*.parquet" }
stack = [
    { repo = "ahmedheakl/the_stack_data_c_0", revision = "a67c76bc0642046546f05507aa7eac0f1a08fefc", files = "data/*.parquet" },
    { repo = "ahmedheakl/the_stack_data_c_1", revision = "c06a94e036a26dec50f9d975e2839aea0dea6939", files = "data/*.parquet" },
    { repo = "ahmedheakl/the_stack_data_c_2", revision = "05abbc26a6aa6d9ad3fadc4614b4ce6de6606e7f", files = "data/*.parquet" },
]
angha_url = "https://codeload.github.com/brenocfg/AnghaBench/tar.gz/d8034ac8562b8c978376008f4b33df01b8887b19"
angha_c = "data/raw/anghabench_c.parquet"
canary_c = "data/sft/canary_c.parquet"
canary_x86 = "data/sft/canary_x86.parquet"
canary_programs = 240        # per type (contest, short, repo); a fresh draw, not the one the rule was chosen on
canary_seed = 20261109
canary_recall = { exact = 0.94, rename = 0.90, "edit_0.05" = 0.85, "edit_0.1" = 0.85, "edit_0.2" = 0.65 }
budget = { gg = 0.01, codenet = 0.10 }
# D5 (Enzo, Nov 10): the RL-train tasks (rl.sources) are items too, and their drops apply to SFT only (ggrpo.rl ignores
# them). Largest share of the SFT documents after D5 (GG, CodeNet sft_only) dropped by eval and RL items together:
# measured Nov 10 at GG 1.56%, CodeNet 13.5% (option A: every overlapping SFT document goes, the RL pool stays whole)
budget_sft = { gg = 0.02, codenet = 0.15 }
fraction = 1.0
workers = 12                 # of the Mac's 15 cores; pass --decontam.workers 4 while the VM build (10 cores) runs
batch = 20000                # documents per worker task; each task also ships the n-gram index, which with the RL
                             # items is too big to send 1,300 times (same output: Nov 10, eval rows byte-identical)
out = "data/sft/decontam.parquet"
items = "data/sft/decontam_items.parquet"

[sft]   # python -m ggrpo.sft (Mac, --extra data, after ggrpo.decontam): TRL prompt-completion parquet
max_prompt_tokens = 16256    # Enzo, Nov 8: 16,384 per side, as [rl]
max_answer_tokens = 16320
max_bytes = 2088960          # 16,320 tokens x 128 bytes, the longest token in the vocabulary
train = "data/sft/train.parquet"
val = "data/sft/val.parquet"

[rl]   # python -m ggrpo.rl (Mac, --extra data, after ggrpo.decontam): the GRPO train file read by grpo_codenet.yaml
sources = ["data/train.jsonl", "data/codenet/train.jsonl"]
tokenizer = "ahmedheakl/gg-armv8-O2"   # the base model's tokenizer (Qwen2.5-Coder; Granite counts ~8% fewer tokens)
tokenizer_revision = "0444a378f384300187c7f43914fc986a81ff051a"
max_prompt_tokens = 16256    # Enzo, Nov 7: 16,384 per side; 128 left for the chat template, so prompt + completion fits
max_answer_tokens = 16320    # grpo_codenet.yaml's 32,768 (the base's positions) with EOS; ~97% of CodeNet problems keep a task
out = "data/rl/train.jsonl"
references = "data/sft/references"   # sft_references.yaml's dataset for SFT on RL references (H2a)

[sample]   # python -m ggrpo.sample (training host GPU1, train venv): the census by default (prereg.md §2)
model = "runs/start_fp16"
dtype = "float16"            # the online arms sample in fp16
tasks = "data/rl/train.jsonl"
seed = "census-2026-11-11"   # fixed before the census; never change it once the census has run
samples = 16
temperature = 1.0            # grpo_codenet.yaml's sampling
top_p = 1.0
top_k = 0
max_tokens = 16384           # grpo_codenet.yaml max_completion_length
max_model_len = 32768        # grpo_codenet.yaml vllm_max_model_length
gpu_memory_utilization = 0.85
chunk = 64
score_batch = 128
stop_mixed = 100000          # Enzo, Nov 17: "All 7,278" -- above any reachable count, so the census runs every RL
                             # task and ends on "no task left to claim". The pool is a prefix (mixed.head(cap) in rank
                             # order), so this cannot change which 864 tasks the planned run trains on; it only means
                             # the pool size never has to be reopened, and the mixed rate is measured on all 7,278.
                             # Was 960 = pool.cap 864 plus 11% margin (Nov 16); 1200 was sized for Package A's 13 runs.
                             # Measured rate on the final model: 36% mixed over the first 128 tasks, not the ~20% the
                             # checkpoint sweep projected, so the full census is ~7,278 tasks x 16 completions
out = "runs/census/census.jsonl"

[pool]   # python -m ggrpo.pool (Mac or training host, after the census and C-0): the pool and the SFT-scale arms' data
census = "runs/census/census.jsonl"
cap = 2944                   # Enzo, Nov 18: every mixed task the census found, rounded down to a multiple of
                             # prompts_per_step (2,954 mixed, 10 dropped). The run was launched with this value; 864
                             # was the Nov 16 figure from the time budget, before the census finished
prompts_per_step = 16
passes = 2
out = "data/rl/pool.jsonl"   # grpo_codenet.yaml data_files
references = "data/sft/pool_references"
offline_rft = "data/sft/offline_rft"

[fp16]   # python -m ggrpo.fp16 (training host, before the census and the GRPO runs): the RL starting model as TRL's vLLM loads it, in fp16
model = "runs/sft_full_seed0"  # the full-data SFT final model (prereg §2 Start; written by save_model at the end)
out = "runs/start_fp16"      # grpo_codenet*.yaml model_name_or_path

[strata]   # python -m ggrpo.strata (Mac, --extra data, after ggrpo.decontam): pass rates by similarity to training
train = ["gg"]               # GG's release trained on GG's SFT pairs only
decontaminated = false
margin = 0.10                # protocol: if high beats clean by more than this, headline the clean subset
scored = ["results/humaneval/modern/modern_beam_search.scored.jsonl", "results/grpo_eval/base_bringup_beam8_rtx5000.scored.jsonl"]
out = "results/strata/gg_base.parquet"

[reward]   # ggrpo.reward (training host)
random_probability = 0.5     # reward_stub's chance of 1.0 (reward_random shuffles the real rewards instead)
seed = 0

[generate]
model = "ahmedheakl/gg-armv8-O2"
revision = "0444a378f384300187c7f43914fc986a81ff051a"
attn_implementation = "sdpa"          # paper eval used flash_attention_2; check it is available on sm_120
device = "cuda"
max_total_tokens = 32000              # paper: max_new_tokens = 32000 - prompt tokens
mode = "beam_search"
out = "runs/base/beam_search.jsonl"
seed = 0

# Decoding is explicit: unset fields come from the checkpoint's generation_config.json
# (do_sample=true, temperature=0.7, top_k=20, top_p=0.8, repetition_penalty=1.1).
# The paper's script passes only num_beams=8, so it inherited do_sample=true (beam sampling), while the paper
# text says sampling was disabled. This mode follows the text and the beam8_cap16k run. Open question for the authors.
# temperature/top_k/top_p only act when do_sample is true, so they are left unset here.
[generate.beam_search]
num_beams = 8
do_sample = false
repetition_penalty = 1.1

[generate.sample]   # the training distribution: must match temperature/top_k/top_p/repetition_penalty in grpo.yaml
num_beams = 1
do_sample = true
temperature = 1.0
top_k = 0
top_p = 1.0
repetition_penalty = 1.0

[score]
tasks = "data/eval.jsonl"
predictions = "runs/base/beam_search.jsonl"
column = "raw"
reference = "runs/preflight/eval_ref.jsonl"   # tasks whose reference ARM passes (authors' tests: all 164)
out = "runs/base/beam_search.scored.jsonl"

[paper]   # python -m ggrpo.paper (uv sync --extra paper): the released eval/eval_huamaneval.py, seeded
script = "../eval/eval_huamaneval.py"
seed = 42            # the script sets none; 42 is the usual default (HF Trainer, LLaMA-Factory)
sample = true        # true: as released (inherits do_sample=true); false: adds do_sample=False (paper text)
out = "runs/paper/as_released"

[equivalence]   # python -m ggrpo.equivalence: log-probs of fixed completions, per package environment, same GPU
completions = "data/raw/humaneval_beam8_cap16k.jsonl"
attn_implementation = "flash_attention_2"
max_tokens = 8192     # prompt + completion; longer sequences are skipped (full-vocabulary logits on a 16 GB GPU)
out = "runs/equivalence/paper_flash.jsonl"
reference = "runs/equivalence/paper_flash.jsonl"   # compared against when it exists and differs from out

[differential]   # python -m ggrpo.differential (Mac or VM): the stronger stdio suite (prereg.md §4)
tasks = "data/codenet/val.jsonl"
solutions = "data/codenet/solutions.parquet"
out = "data/codenet/differential_val.jsonl"
mutations = 150
boundaries = 50
voters = 30
voter_attempts = 60
min_kept = 20
max_output_bytes = 4096
workers = 6

[recheck]   # python -m ggrpo.recheck: the sample tests' false-pass rate under the differential suite
scored = "results/codenet_val/sft_full_11328_beam8.scored.jsonl"
column = "completion"
suites = "data/codenet/differential_val.jsonl"
out = "results/codenet_val/sft_full_11328_beam8.recheck.jsonl"
workers = 6

[calibration]   # python -m ggrpo.calibration: the differential suite against AOJ's official tests (prereg.md §4)
completions = "results/codenet_val/gg_base_sample8.jsonl"
column = "raw"
suites = "data/codenet/differential_val.jsonl"
official = "data/contest/aoj_eval.parquet"
out = "results/codenet_val/gg_base_sample8.calibration.jsonl"
workers = 6

[score_samples]   # python -m ggrpo.score_samples (Mac): score ggrpo.sample rows written unscored on a GPU host
samples = "results/codenet_val/e2/raw/start_T0_sample16.jsonl"
url = "http://192.168.64.2:8765/score"
batch = 128
out = "results/codenet_val/e2/start_T0_sample16.jsonl"

[official]   # python -m ggrpo.official: sample tests, then the official tests on AOJ and Codeforces problems (prereg.md §4)
scored = "results/codenet_val/sft_full_11328_beam8.scored.jsonl"
column = "completion"
official = ["data/contest/aoj_eval.parquet", "data/contest/codeforces_eval.parquet"]   # Codeforces built Nov 22
out = "results/codenet_val/official/sft_full_11328_beam8.jsonl"
workers = 6

[x86]   # python -m ggrpo.x86: the x86 source as the third voter, run under Rosetta in the VM (prereg.md §4)
suites = "data/codenet/differential_val.jsonl"
tasks = "data/codenet/val.jsonl"
out = "data/codenet/differential_val_x86.jsonl"
host = "admin@192.168.64.2"
worker = "ops/vm/x86_worker.py"

[log]
file = "runs/ggrpo.jsonl"

[track]   # python -m ggrpo.track (scored evals -> W&B, at their training step) and ggrpo.report (W&B -> paper table)
entity = "assembly-transpilation"      # grpo.yaml WANDB_ENTITY
project = "rlvr"                       # grpo.yaml WANDB_PROJECT
exclude = ["satomi"]                   # BringUp: its reference never builds (helpers miss -I../common); the paper scores 65 of 66
export = "results/paper/evals.csv"
# python -m ggrpo.dashboard rewrites this report in place; without it every run would publish a fresh url
report = "https://forge.coreweave.com/assembly-transpilation/rlvr/reports/GG-RLVR---one-dashboard--VmlldzoxODMyOTA5Nw=="

# Run ids are set by the launcher (WANDB_RUN_ID); names are the recipe, seeds live in the run config.
# Metrics are eval/<benchmark>_<decoding>, all pass@1; sample8 is the dev diagnostic, not a reported metric.
[track.runs.gg]
name = "GG"                            # the base model, no RL
[track.runs.gg.evals.0]
dev_beam8 = "results/grpo_eval/base_dev_beam_search.scored.jsonl"
dev_sample8 = "results/grpo_eval/base_dev_sample8.scored.jsonl"
humaneval_beam8 = "results/humaneval/modern/modern_beam_search.scored.jsonl"
humaneval_sample8 = "results/grpo_eval/base_humaneval_sample8.scored.jsonl"
bringup_beam8 = "results/grpo_eval/base_bringup_beam8_rtx5000.scored.jsonl"
bringup_greedy = "results/grpo_eval/base_bringup_greedy_rtx5000.scored.jsonl"
codenet_val_beam8 = "results/codenet_val/gg_base_beam8_t517.scored.jsonl"   # the 2026-11-15 rerun under 5.17 (65/383, 0 flips)
codenet_val_sample8 = "results/codenet_val/gg_base_sample8.scored.jsonl"

[track.runs.grpo-seed0]
name = "GRPO"
[track.runs.grpo-seed0.evals.27]
dev_beam8 = "results/grpo_eval/checkpoint-27_dev.scored.jsonl"
dev_sample8 = "results/grpo_eval/27_dev_sample8.scored.jsonl"
[track.runs.grpo-seed0.evals.54]
dev_beam8 = "results/grpo_eval/checkpoint-54_dev.scored.jsonl"
dev_sample8 = "results/grpo_eval/54_dev_sample8.scored.jsonl"
[track.runs.grpo-seed0.evals.81]
dev_beam8 = "results/grpo_eval/checkpoint-81_dev.scored.jsonl"
dev_sample8 = "results/grpo_eval/81_dev_sample8.scored.jsonl"
[track.runs.grpo-seed0.evals.106]
dev_beam8 = "results/grpo_eval/checkpoint-106_dev.scored.jsonl"
dev_sample8 = "results/grpo_eval/106_dev_sample8.scored.jsonl"
humaneval_beam8 = "results/grpo_eval/checkpoint-106_humaneval.scored.jsonl"
bringup_beam8 = "results/grpo_eval/checkpoint-106_bringup_beam8.scored.jsonl"
bringup_greedy = "results/grpo_eval/checkpoint-106_bringup_greedy.scored.jsonl"
humaneval_sample8 = "results/grpo_eval/checkpoint-106_humaneval_sample8.scored.jsonl"   # ponyo runs/full_eval

[track.runs.grpo-seed1]   # stopped at update 31 (Enzo, Oct 23); checkpoint-27 is its only model
name = "GRPO"
[track.runs.grpo-seed1.evals.27]
